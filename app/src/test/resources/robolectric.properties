# Global Robolectric configuration for all Robolectric unit tests.
#
# sdk=37: the API level Robolectric emulates. It must move together with the
# org.robolectric:android-all-instrumented coordinate in app/build.gradle.kts
# and with the Robolectric version in gradle/libs.versions.toml: Robolectric
# resolves the framework jar from its own SDK -> build-id table and the test
# task runs offline against exactly the jar named there, so changing one of the
# three alone fails every Robolectric class with "Path is not a file:
# ...android-all-instrumented-...".
#
# The Robolectric version is 4.18-beta-1 because that is the release whose table
# maps 37 -> 17-robolectric-16653203-i7 (4.17 has no such entry; it names
# 17-robolectric-15733970-i7 for 37). SDK 36+ also requires a Java 21 test JVM,
# which gradle/gradle-daemon-jvm.properties already provides.
#
# application: force a stock android.app.Application. With android resources
# enabled Robolectric also honours the manifest's android:name=".ThreeMailApplication"
# and would boot the full Hilt application (ThreeMailApplication.onCreate ->
# Hilt injection -> Room database build), which is neither needed nor wanted by
# these plain RobolectricTestRunner unit tests - they construct their subjects
# directly. Booting it also surfaced an unrelated Room builder error at app
# startup. A stock Application keeps the app's resources available (so
# context.getString(R.string.*) still resolves) without running app startup.
sdk=37
application=android.app.Application
